<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Духовное напутствие</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #f4f1ea;
            color: #2c2520;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background: #ffffff;
            padding: 50px 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            border: 2px solid #d4af37;
        }
        h1 {
            font-size: 24px;
            color: #8b0000;
            margin-top: 0;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        .quote {
            font-size: 19px;
            line-height: 1.6;
            margin-bottom: 10px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>☦ Духовное напутствие</h1>
    <div class="quote" id="quote-text">Загрузка наставления...</div>
</div>

<script>
    const quotes = [
        "«Корень учения горек, а плод его сладок». — Святитель Иоанн Златоуст.",
        "«Ум без благочестия — что меч в руках безумца». — Святитель Василий Великий.",
        "«Знание без доброй жизни — не благо, а зло». — Святитель Димитрий Ростовский.",
        "«Усердный в учении уподобляется пчеле, собирающей нектар с лучших цветов».",
        "«Самая большая победа — это победа над своей ленью и унынием».",
        "«Не теряй времени даром, учись прилежно, ведь знание — это свет, данный Богом для добрых дел».",
        "«Господь видит твои старания на каждом уроке. Молись — и Бог поможет!»",
        "«Начинай всякое дело с короткой молитвы, и оно пойдет легко и споро».",
        "«Учеба — это твой маленький духовный подвиг, приносимый Богу каждый день».",
        "«Кто малым пренебрегает, тот постепенно падет». — Преподобный авва Дорофей.",
        "«Где просто, там ангелов со сто, а где мудрено, там ни одного». — Преподобный Амвросий Оптинский.",
        "«Стяжи мир в душе твоей, и вокруг тебя спасутся тысячи». — Преподобный Серафим Саровский.",
        "«Бог смотрит не на то, велики ли наши дела, а на то, с какой любовью они делаются».",
        "«Твой ангел-хранитель радуется, когда ты уступаешь другу или помогаешь однокласснику».",
        "«Сделай сегодня скрытое доброе дело так, чтобы о нем никто не узнал».",
        "«Храни мир в душе и делись радостью с каждым, кто учится рядом с тобой».",
        "«Обид не замечай, сам никого не обижай». — Преподобный Амвросий Оптинский.",
        "«Благодари Бога за каждый прожитый день, и уныние никогда не коснется твоего сердца».",
        "«Если хочешь, чтобы тебя любили, сам люби всех». — Святитель Лука Крымский.",
        "«Каждое доброе слово — это маленькая свеча, зажженная в темноте».",
        "«Верный друг — крепкая защита; кто нашел его, нашел сокровище». — Книга Сираха.",
        "«Не судите, да не судимы будете». — Евангелие от Матфея.",
        "«Правда — это самый короткий путь к миру с Богом и людьми».",
        "«Совесть — это голос Божий в твоем сердце. Всегда прислушивайся к нему».",
        "«Лучше потерпеть неудачу честно, чем победить с помощью обмана».",
        "«Кто хранит уста свои, тот бережет душу свою». — Книга Притчей.",
        "«Зависть сушит сердце. Радуйся успехам других, как своим собственным».",
        "«Не будь побежден злом, но побеждай зло добром». — Апостол Павел.",
        "«Мудрый человек сначала думает, а потом говорит».",
        "«Красота человека — не в лице, а в добром нраве и чистоте мыслей».",
        "«Твое доброе настроение сегодня — это лучший подарок для твоих учителей и родителей».",
        "«Порадуй сегодня родителей хорошей новостью, добрым словом или оценкой».",
        "«Прояви сегодня христианское терпение там, где раньше тебе хотелось поспорить».",
        "«Наведи сегодня идеальный порядок на своей парте и помоги убраться дежурным».",
        "«Улыбнись сегодня тому, с кем редко общаешься — подари человеку радость».",
        "«Всякое доброе дело, сделанное ближнему, делается Самому Христу».",
        "«Будь внимателен к деталям: из малых верных шагов складывается великий путь».",
        "«Господь укрепит тебя, если ты искренне попросишь Его о помощи перед уроком».",
        "«Постарайся сегодня никого не осудить и ни на кого не держать обиды».",
        "«Помни, что ты — чадо Божие, носи это звание с честью и кротостью»."
    ];

    function getRandomQuote() {
        const randomIndex = Math.floor(Math.random() * quotes.length);
        document.getElementById('quote-text').innerText = quotes[randomIndex];
    }

    window.onload = getRandomQuote;
</script>

</body>
</html>
