<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Духовное напутствие для учителей</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #f4f1ea;
            color: #2c2520;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background: #ffffff;
            padding: 50px 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 550px;
            width: 100%;
            border: 2px solid #d4af37;
        }
        h1 {
            font-size: 24px;
            color: #8b0000;
            margin-top: 0;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        .quote {
            font-size: 19px;
            line-height: 1.6;
            margin-bottom: 10px;
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>☦ Духовное напутствие для наставников</h1>
    <div class="quote" id="quote-text">Загрузка наставления...</div>
</div>

<script>
    const quotes = [
        "«Прежде чем говорить о Боге, яви Его своей жизнью».",
        "«Учитель подобен свече, которая светит другим, сгорая сама». — Святитель Филарет Московский.",
        "«Воспитывать — значит питать душу ребенка добром и правдой».",
        "«Не столько слово твое, сколько жизнь твоя должна быть правилом для тех, кого ты учишь». — Святитель Тихон Задонский.",
        "«Истинный педагог не просто передает знания, но согревает детские души своей любовью».",
        "«Труд учителя — это соработничество Богу в созидании человека».",
        "«Чтобы зажечь других, нужно самому гореть верой и любовью».",
        "«Самое лучшее воспитание — это пример благочестивой жизни самого учителя».",
        "«Педагогика — это не профессия, это служение, доверенное Самим Господом».",
        "«Ученик — это не сосуд, который нужно наполнить, а факел, который нужно зажечь». — Плутарх.",
        "«Любовь покрывает множество грехов. Терпение в обучении — это семя, которое обязательно прорастет».",
        "«Слово лечит, слово ранит. Пусть каждое твое слово к ребенку будет растворено любовью».",
        "«Где нет любви, там никакие методики и правила не принесут доброго плода».",
        "«В каждом ребенке скрыт образ Божий. Задача учителя — помочь ему воссиять».",
        "«Строгость должна быть растворена кротостью, чтобы не ожесточить детское сердце».",
        "«Будьте к детям как можно более мягкими, терпеливыми и доступными». — Святитель Лука Крымский.",
        "«Обучая других, мы сами учимся у детей чистоте веры и искренности».",
        "«Учительская мудрость заключается в умении вовремя простить и дать ребенку второй шанс».",
        "«Если ребенок не понимает, вини себя, а не его; ищи новые пути к его сердцу».",
        "«Терпение — это корень христианских добродетелей, особенно необходимый педагогу».",
        "«Когда иссякают человеческие силы и терпение, призови Господа — Он укрепит».",
        "«Молитва за учеников имеет великую силу и покрывает их там, где бессильны слова».",
        "«Труд учителя измеряется не оценками в журнале, а миром в душах его воспитанников».",
        "«Сейте доброе семя, а взрастит его Господь в свое, ведомое Ему время».",
        "«Каждый трудный ученик — это твой крест и твоя возможность возрасти в любви».",
        "«Пусть главным правилом твоего дня станет мирное устроение духа, передающееся детям».",
        "«Ничего не делайте в раздражении: гнев никогда не созидает правды Божией».",
        "«Радуйтесь малому успеху ребенка, ведь из малых искр разгорается пламя большой веры».",
        "«Не унывайте, видя несовершенство мира; ваш труд — это лепта, положенная в сокровищницу Вечности».",
        "«Благодарите Бога за право быть наставником, ведь это служение ангельское».",
        "«Воспитание без духовности — это здание, построенное на песке».",
        "«Сначала научи ребенка любить добро, а затем требуй от него знаний».",
        "«Самое трудное в воспитании — научить себя тому, чему хочешь научить других».",
        "«Будьте для детей не просто строгими судьями, но любящими отцами и матерями».",
        "«Величайшее искусство педагога — уметь пробудить радость в творческом выражении и знании». — Альберт Эйнштейн."
    ];

    function getRandomQuote() {
        const randomIndex = Math.floor(Math.random() * quotes.length);
        document.getElementById('quote-text').innerText = quotes[randomIndex];
    }

    window.onload = getRandomQuote;
</script>

</body>
</html>
